*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:15.5px;}
body{background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
html[dir="rtl"] body{font-family:"Segoe UI",Tahoma,Inter,system-ui,sans-serif;}
input,select,textarea,button{font-family:inherit;font-size:0.95rem;}
button{cursor:pointer;} button:disabled{cursor:default;opacity:.55;}

.hov:hover{background:#231F1E !important;}
.tile{transition:border-color .15s ease,transform .15s ease;} .tile:hover{border-color:#E11A22 !important;transform:translateY(-2px);}
@media (prefers-reduced-motion:reduce){.tile,.tile:hover{transition:none;transform:none;}}
@media (max-width:860px){
  .sidebar{position:fixed !important;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%);transition:transform .25s ease;}
  html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(100%);}
  .sidebar.open{transform:translateX(0) !important;}
  .overlay{position:fixed;inset:0;background:#00000088;z-index:700;}
  .hamb{display:flex !important;} .drawer{width:100vw !important;}

  .tiles{grid-template-columns:repeat(2,1fr) !important;} .main-pad{padding:18px 16px !important;}
}

  else if(cur==="mine") body=e(MyRequests,{me,tickets,onOpen:x=>setSel(x.id)});
  else if(cur==="queue") body=e(Queue,{me,role,tickets,onOpen:x=>setSel(x.id),selId:sel});
  else if(cur==="approvals") body=e(Approvals,{me,role,tickets,onOpen:x=>setSel(x.id),onChanged,toast});
  else if(cur==="kb") body=e(KBView,{onKB:setKb});
  else if(cur==="dash") body=e(Dashboard,{tickets});
  else if(cur==="rules") body=e(Rules);
  else if(cur==="assets") body=e(Assets,{assets,tickets,onOpenAsset:setAssetSel,onAdd:()=>{setAErr("");setAssetEd({isNew:true,item:{id:"",type:"laptop",model:"",serial:"",owner:null,location:"",status:"in_stock",purchased:"",warranty:"",notes:""}});}});
  else if(cur==="admin") body=e(Admin,{setCfg,toast,onKB:setKb});

  return e("div",{"data-lang":lang,style:{display:"flex",minHeight:"100vh"}},
    nav&&e("div",{className:"overlay",onClick:()=>setNav(false)}),
    sidebar,
    e("main",{style:{flex:1,minWidth:0}},
      e("div",{style:{padding:"14px 26px",borderBottom:"1px solid #332C2B",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,background:"#12100Fee",backdropFilter:"blur(6px)",zIndex:50}},
        e("button",{className:"hamb",onClick:()=>setNav(true),"aria-label":t("menu"),style:{display:"none",background:"none",border:"1px solid #332C2B",color:"#C9C6C4",borderRadius:8,padding:"6px 10px"}},"☰"),
        e("h2",{style:{fontSize:"1.15rem",fontWeight:700,flex:1,minWidth:0}},t(TITLE[cur])),langBtn),
      e("div",{className:"main-pad",style:{padding:"22px 26px",maxWidth:1260}},body)),
    selT&&e(Drawer,{tk:selT,me,role,onClose:()=>setSel(null),onChanged,toast}),
    assetSel&&!assetEd&&assets.find(a=>a.id===assetSel)&&e(AssetModal,{a:assets.find(a=>a.id===assetSel),role,tickets,onClose:()=>setAssetSel(null),
      onOpenTicket:id=>{setAssetSel(null);setSel(id);},onEdit:()=>{setAErr("");setAssetEd({isNew:false,item:assets.find(a=>a.id===assetSel)});},onDelete:()=>setAssetDel(assetSel)}),
    assetEd&&e(AssetEditor,{a0:assetEd.item,isNew:assetEd.isNew,busy:aBusy,err:aErr,onClose:()=>setAssetEd(null),onSave:async a=>{
      setABusy(true); setAErr("");
      try{ setAssets(await api("save-asset",{asset:a,isNew:assetEd.isNew})); setAssetEd(null); setAssetSel(a.id.trim().toUpperCase()); toast(t("toast_device_saved")); api("bootstrap").then(setCfg).catch(()=>{}); }
      catch(x){ setAErr(x.message); } finally{ setABusy(false); } }}),
    assetDel&&e(Confirm,{text:t("confirm_delete_device",{id:assetDel}),busy:aBusy,onClose:()=>setAssetDel(null),onYes:async()=>{
      setABusy(true); try{ setAssets(await api("delete-asset",{id:assetDel})); setAssetSel(null); toast(t("toast_device_deleted")); }catch(x){ toast(x.message,"error"); } finally{ setABusy(false); setAssetDel(null); } }}),
    newT&&e(NewTicket,{me,initialCat:newT.cat,initialText:newT.text,onClose:()=>setNewT(null),onKB:setKb,onCreated:tk=>{ onChanged(tk); setNewT(null); go("mine"); toast(t("toast_created",{id:tk.id})); }}),
    kb&&e(KBModal,{a:kb,onClose:()=>setKb(null)}),
    e(Toast,{toast:toastS}));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
